name: Artifacts Workflow

on:
  push:

jobs:
    artifacts:
        runs-on: ubuntu-latest
        steps:
            - name: Cloning Repo code to runner
              uses: actions/checkout@v4

            - name: Create a file
              run: echo "This is an artifact file." > artifact.txt

            - name: Upload artifact
              uses: actions/upload-artifact@v5
              with:
                name: my-artifact
                path: artifact.txt

    download-artifacts:
        runs-on: ubuntu-latest
        needs: artifacts
        steps:
            - name: Download artifact
              uses: actions/download-artifact@v5
              with:
                name: my-artifact
            - run: cat artifact.txt